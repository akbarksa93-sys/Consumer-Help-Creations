        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
    </style>
</head>
