<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSUMER HELP CREATIONS DIGITAL FASHION STORE</title>
    <style>
        body {
            margin: 0;
            background: #fffaf5;
            font-family: Arial, Helvetica, sans-serif;
        }
        .header {
            background: #4c1d95;
            color: #fff;
            text-align: center;
            padding: 22px 12px;
        }
        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .header p {
            margin: 8px auto 0 auto;
            max-width: 940px;
            font-size: 13.5px;
            line-height: 1.6;
            opacity: 0.95;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            padding: 18px;
        }
        .card {
            width: 260px;
            border: 2px solid #7c3aed;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            position: relative;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .info {
            padding: 10px 12px;
        }
        .info h3 {
            margin: 0 0 8px 0;
            font-size: 14.5px;
            line-height: 1.3;
            color: #111;
            font-weight: 800;
            min-height: 42px;
        }
        .prices {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }
        .orig {
            color: #888;
            text-decoration: line-through;
            font-size: 12px;
        }
        .sale {
            color: #dc2626;
            font-weight: 900;
            font-size: 19px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CONSUMER HELP CREATIONS</h1>
        <p>Welcome to our Digital Fashion Store. Browse our curated collection of women's fashion and ethnic wear.</p>
    </div>

    <div class="grid">
        <div class="card">
            <div class="info">
                <h3>Featured Fashion Item</h3>
                <div class="prices">
                    <span class="sale">Special Offer</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
